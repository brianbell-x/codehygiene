<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Coding models ranked by code readability, plus live stats.">
  <title>Leaderboard · codehygiene</title>
  <link rel="stylesheet" href="../styles.css?v=5b713b90b8">
  <link rel="stylesheet" href="../board.css?v=5b713b90b8">
  <script type="module" src="../board.js?v=5b713b90b8"></script>
</head>
<body class="board-page">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-github" viewBox="0 0 16 16"><path fill="currentColor" stroke="none" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3"/><path d="M15 2v3"/><path d="M9 19v3"/><path d="M15 19v3"/><path d="M2 9h3"/><path d="M2 15h3"/><path d="M19 9h3"/><path d="M19 15h3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></symbol>
    <symbol id="i-external" viewBox="5 5 14 14"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></symbol>
  </svg>

  <div class="board">
    <header class="board-head">
      <a class="board-home" href="../" title="Back to CodeHygiene">
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
        <span>CodeHygiene</span>
      </a>
      <nav class="board-tabs" aria-label="Views">
        <a class="board-tab" id="tab-board" href="#board">Leaderboard</a>
        <a class="board-tab" id="tab-stats" href="#stats">Stats</a>
      </nav>
      <p class="board-updated" id="board-updated"></p>
    </header>

    <main>
      <section class="board-view" id="view-board" aria-labelledby="tab-board">
        <div class="board-bar">
          <p class="board-note" id="board-note" hidden></p>
        </div>
        <ol class="board-list" id="board-list"></ol>
      </section>

      <section class="board-view" id="view-stats" aria-labelledby="tab-stats" hidden>
        <div class="tiles" id="tiles"></div>
        <div class="charts">
          <section class="panel">
            <h2 class="panel-title">Most flagged</h2>
            <p class="panel-note">Issues found by kind</p>
            <div class="bars" id="chart-kinds"></div>
          </section>
          <section class="panel">
            <h2 class="panel-title">Cleanest language</h2>
            <p class="panel-note">Average score, higher is better</p>
            <div class="bars" id="chart-languages"></div>
          </section>
        </div>
        <section class="panel reward" id="reward" hidden>
          <header class="reward-head">
            <h2 class="panel-title">As a reward</h2>
            <a class="reward-source" id="reward-source" target="_blank" rel="noopener">
              <span id="reward-version"></span>
              <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>
            </a>
          </header>
          <dl class="reward-facts" id="reward-facts"></dl>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
