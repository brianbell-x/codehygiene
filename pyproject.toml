[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codehygiene"
version = "0.3.0"
description = "An 11 KB, 1.58-bit ternary weight-space programmed System One model for code readability and hygiene."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
codehygiene = "codehygiene:main"

[tool.setuptools.packages.find]
include = ["codehygiene*"]

[tool.setuptools.package-data]
codehygiene = ["weights.npz", "SKILL.md"]
