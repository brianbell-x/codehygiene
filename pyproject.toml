[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codehygiene"
version = "0.2.0"
description = "A 33 KB, weight-space programmed System One model for linting and scoring code aesthetics."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
codehygiene = "codehygiene:main"

[tool.setuptools.packages.find]
include = ["codehygiene*"]

[tool.setuptools.package-data]
codehygiene = ["weights.npz"]
