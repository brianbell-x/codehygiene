[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codehygiene"
version = "0.6.1"
description = "A 23.8 KiB, 1.58-bit ternary weight-space programmed System One model for code readability and hygiene."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["code-hygiene", "readability", "linter", "ai-agents", "skills", "weight-space-programming", "system-one", "ternary"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.scripts]
codehygiene = "codehygiene:main"

[tool.setuptools.packages.find]
include = ["codehygiene*"]

[tool.setuptools.package-data]
codehygiene = ["weights.npz", "SKILL.md", "engine.js"]
